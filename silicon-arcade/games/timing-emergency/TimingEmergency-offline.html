function game(){const r=result(),c=chapterData(current.chapter);return `<main class="workarea"><div class="case-title"><div><div class="eyebrow">${mode==='endless'?`NIGHT SHIFT · ROUND ${round} · SCORE ${runScore}`:`WARD 0${current.chapter} · CASE ${String(current.number).padStart(2,'0')} · ${esc(c.title)}`}</div><h2>${esc(current.title)} <span class="chip">${esc(current.triage||'时序诊断')}</span></h2><p>${esc(current.brief)}</p></div><div class="timer" id="timer-display">${isTimed()?timeString(remaining):'∞'}<small>${isTimed()?'手术剩余 / SEC':'常规诊疗 · 自由推敲'}</small></div></div><div class="game-grid"><aside class="panel inspector-panel"><div class="panel-head"><h3>处方器材 / 替换预览</h3><small>1–9</small></div>${inspector(r)}</aside><section><div class="panel"><div class="toolbar">${button('↶ 撤销','undo',undo.length?'':'disabled')}${button('↷ 重做','redo',redo.length?'':'disabled')}${button('恢复入院','reset')}${button('⊙ 最危险路径','worst')}${button('Ⅱ 暂停','pause')}</div><div class="board-wrap">${board(r)}</div><div class="board-caption"><span>点击门或线路 → 选择处方 · 金色路径＝当前追踪</span><span>▣ 封装固定</span></div>${timeline(r)}</div><div class="briefbox"><strong>主治医嘱：</strong>${esc(current.lesson)}${selectedPath(r)?`<br>追踪：最晚 ${esc(selectedPath(r).nodes?.join(' → '))}；最早 ${esc(selectedPath(r).minNodes?.join(' → '))}`:''}</div><div class="footer-controls"><div>${button('会诊提示','hint')} ${save.purchases.includes('notebook')?button('保存试验','notebook-save')+' '+button('载入试验','notebook-load',save.notebook?.[current.id]?'':'disabled'):''}</div>${button('复检 · 申请出院','submit','','primary')}</div><small class="muted">${assisted?'已使用演示会诊，本次星章上限 1 星。':'预算按最终差异计。任何一条路径违规或资源超限，均不能出院。'} ${isTimed()?'切出窗口自动暂停；时间耗尽可重试同一病例。':''}</small></section>${monitors(r)}</div></main>`;}
function timeString(n){return `${Math.floor(Math.max(0,n)/60).toString().padStart(2,'0')}:${Math.floor(Math.max(0,n)%60).toString().padStart(2,'0')}`;}
function workshop(){return `<main class="home"><div class="eyebrow">RESEARCH / SIDEWAYS STRATEGIES</div><h2 style="margin:15px 0">器材研发</h2><p class="muted" style="margin-bottom:25px">新器材提供诊断便利或新的处方。章节轮转会自动提供必需工具；购买不会扩大任何病例的预算。</p><section class="upgrade-grid">${UPGRADES.map(u=>{const owned=save.purchases.includes(u.id);return `<article class="upgrade"><div class="eyebrow">${owned?'INSTALLED / 已装配':'R&D / 待研发'}</div><h3>${esc(name(u))}</h3><p>${esc(u.description)}</p>${button(owned?'已研发':`研发 · ${u.price} 点`,'buy',`data-id="${u.id}" ${owned||save.credits<u.price?'disabled':''}`,owned?'':'primary')}</article>`;}).join('')}</section><div class="briefbox">材料点是病例内资源，研发点是科室成长奖励。最强驱动也会增加上游负载；精密器材有面积与功耗代价。旧器材仍能成为更好的处方。</div></main>`;}
function records(){const records=LEVELS.filter(l=>save.completed[l.id]);return `<main class="home"><div class="eyebrow">ARCHIVE / PERSONAL BEST</div><h2 style="margin:15px 0 25px">病案档案</h2><section class="panel">${records.length?records.map(l=>{const c=save.completed[l.id];return `<div class="history-item"><div><strong>${String(l.number).padStart(2,'0')} · ${esc(l.title)} <span class="stars">${'★'.repeat(c.stars)}</span></strong><small>三类个人最佳保存完整电路，载入后重新复检。</small></div><div class="history-actions">${[['edits','少改'],['cost','省料'],['margin','稳健']].map(([k,n])=>button(n,'record',`data-level="${l.id}" data-kind="${k}" ${c.best?.[k]?'':'disabled'}`,'small')).join('')}</div></div>`;}).join(''):'<div class="empty">尚未归档病例。完成第一台手术即可建立档案。</div>'}</section></main>`;}
function settings(){return `<main class="home help-text"><div class="eyebrow">PREFERENCES / LOCAL SAVE</div><h2 style="margin:15px 0">值班设置</h2>${[['sound','操作与复检音效','本地合成音效，无外部音频资源。'],['motion','监护动画','关闭扫描线与路径流动，减轻动态干扰。'],['contrast','增强文字对比','提高边框与说明文字的可读性。'],['timeAssist','战役计时辅助','战役限时病例给予两倍时间，重新入院后生效。夜班保留原计时。']].map(([k,n,d])=>`<div class="settings-row"><div><strong>${n}</strong><small>${d}</small></div>${button(save.settings[k]?'已开启':'已关闭','setting',`data-id="${k}" aria-pressed="${!!save.settings[k]}"`)}</div>`).join('')}<div class="settings-row"><div><strong>存档备份</strong><small>自动保存在本机，并保留上一份有效档案；可导出 JSON 转移到桌面版。</small></div><div>${button('导出存档','export')} ${button('导入存档','import')}</div></div><input type="file" id="import-file" accept="application/json,.json" hidden><div class="settings-row"><div><strong>重新轮转</strong><small>清除战役进度、研发与个人最佳。</small></div>${button('清空进度','wipe','','danger')}</div></main>`;}
function help(){return `<main class="home help-text"><div class="eyebrow">ON-CALL MANUAL / READ THE SIGNAL</div><h2 style="margin:15px 0">值班手册</h2><h3>01 · 先看哪种病</h3><p>setup 裕量小于零，说明某条信号到得太晚，需要加速。hold 裕量小于零，说明信号到得太早，需要在短路径增加延迟。同一电路可能同时有两种病，必须全部治好。</p><h3>02 · 点击病灶，比较处方</h3><p>点击电路中的门或线路，再选择左侧部件。每个候选都会预览替换后的全局早、晚裕量。强驱动让本门更快，却让它的输入变重，可能拖慢上游及其他支路。buffer 增加自己的延迟，同时隔离下游负载。延迟片修复抢拍；铜线适合长线提速；屏蔽线用于降低多工况波动；精密门缩小最早与最晚的区间。</p><h3>03 · 一张合格处方要满足所有上限</h3><p>全部接收端、全部工况的最小与最大到达时间都必须在窗口内，最终替换差异、材料点、器材面积和器材功耗也必须达标。预算按当前处方相对入院电路计，换回初始部件会返还预算。撤销与重做免费。接口处列出的面积与功耗是本次手术新增代价。</p><h3>04 · 轮转与夜班</h3><p>六章共 ${LEVELS.length} 个病例，逐例解锁。每章末有计时综合抢救；常规病例允许自由推敲。器材研发能提前提供侧向新解法，必需工具会随章节自动配发。夜班采用确定种子，生成器对持有装备的见证处方作正式复检，并随轮次增加规模与组合难度。</p><h3>05 · 会诊、个人最佳和快捷键</h3><p>会诊提示逐层展开，最后可请主治演示下一次替换。演示会诊将本次星章上限设为一星。少改、省料、稳健三类档案各自保存完整有效方案。快捷键：Ctrl+Z 撤销，Ctrl+Y / Ctrl+Shift+Z 重做；1–9 选择处方；空格暂停；方向键轮换可编辑门；Enter 复检。所有元件和线路也可 Tab 聚焦、Enter 选择。</p><h3>模型说明</h3><p>这是固定时钟的简化寄存器间时序游戏，分别传播最小/最大到达时间，并计算门输入电容、输出负载、线路电容及器材隔离。多工况给固定倍率，不引入运行时随机判定。模型用于游戏与直观教学，不代替真实芯片签核。</p><div style="margin-top:28px">${button('开始值班','continue','','primary')}</div></main>`;}
function modalHTML(){if(!modal)return '';let html='';if(modal==='tutorial')html=`<div class="eyebrow">入职值班 / 60秒读懂</div><h2>先诊断，再开处方。</h2><div class="tutorial-step"><span>01</span><p><strong>读监护数值。</strong><br>晚裕量负数＝迟到；早裕量负数＝抢拍。两者都要达到零以上。</p></div><div class="tutorial-step"><span>02</span><p><strong>点击门或线路。</strong><br>左侧选择替换器材，候选显示整张电路的预测变化。先尝试第一关的强驱动门。</p></div><div class="tutorial-step"><span>03</span><p><strong>预算达标，再复检。</strong><br>资源与最终差异是硬条件。撤销免费；复检通过才能出院。</p></div><div class="modal-actions">${button('开始接诊','close-modal','','primary')}</div>`;
else if(modal==='paused')html=`<div class="eyebrow">SURGERY PAUSED</div><h2>手术已暂停</h2><p>计时与处方均已冻结。切出窗口也会自动暂停。</p><div class="modal-actions">${button('返回分诊大厅','nav','data-screen="home"')}${button('继续手术','close-modal','','primary')}</div>`;
else if(modal==='timeout')html=`<div class="eyebrow">TIMEOUT / SAME CASE RETRY</div><h2>抢救时间耗尽</h2><p>病例与编号保留。可用相同预算重新诊断；本次处方仍可在重试前查看。</p><div class="modal-actions">${button('返回大厅','nav','data-screen="home"')}${button('重试同一病例','retry','','primary')}</div>`;
else if(modal==='hints')html=`<div class="eyebrow">CONSULTATION / ${hintCount}级</div><h2>主治会诊</h2><div class="hints">${current.hints.slice(0,hintCount).map((h,i)=>`<p><strong>${i+1}.</strong> ${esc(h)}</p>`).join('')}</div><div class="modal-actions">${button('返回手术','close-modal')}${hintCount<3?button('进一步会诊','hint','','primary'):button('演示下一次替换','demonstrate','','primary')}</div><p><small>提示免费。主动选择演示后，本次星章上限为一星。</small></p>`;
else if(modal==='failed'){const r=result();html=`<div class="eyebrow">RECHECK / NEEDS INTERVENTION</div><h2>尚未达到出院条件</h2><p>${r.minSlack<0?'存在抢拍路径。 ':''}${r.maxSlack<0?'存在迟到路径。 ':''}${[...(r.errors||[]),...(r.violations||[]).map(v=>v.message)].map(esc).join('；')||'检查右侧资源上限与每条路径。'}</p><p>点击“最危险路径”查看连锁反应，再用有限处方修复。</p><div class="modal-actions">${button('继续诊疗','close-modal','','primary')}</div>`;}
else if(modal==='success'){const r=result(),rec=save.completed[current.id],goals=starTargets(current);html=`<div class="eyebrow">DISCHARGED / ALL VITALS STABLE</div><h2>病例抢救成功</h2><div class="stars" style="font-size:30px">${mode==='campaign'?'★'.repeat(rec?.stars||1)+'☆'.repeat(3-(rec?.stars||1)):'✦ 夜班继续'}</div><p>全部信号、全部工况回到安全窗口，处方资源也在硬上限内。</p>${mode==='campaign'?`<div class="briefbox"><strong>星章目标</strong><br>✓ 出院星：所有硬条件达标。<br>${r.edits<=goals.edits?'✓':'○'} 少改星：最多 ${goals.edits} 次替换；本次 ${r.edits} 次。<br>${Math.min(r.minSlack,r.maxSlack)>=goals.margin?'✓':'○'} 稳健星：共同裕量至少 ${fmt(goals.margin)}；本次 ${fmt(Math.min(r.minSlack,r.maxSlack))}。${assisted?'<br>本次使用演示会诊，星章上限为 1。':''}</div>`:''}<div class="modal-grid"><div><small>最终替换</small><strong>${r.edits}</strong><small>上限 ${current.limits.edits}</small></div><div><small>材料点</small><strong>${fmt(r.cost)}</strong><small>上限 ${current.limits.cost}</small></div><div><small>最坏裕量</small><strong>${fmt(Math.min(r.minSlack,r.maxSlack))}</strong><small>早与晚全部达标</small></div></div><p>${mode==='campaign'?`病案已保存，研发点 ${save.credits}。尝试减少替换或提高余量，可更新个人最佳。`:`本轮积分累计 ${runScore}，下一轮规模和组合复杂度继续递进。`}</p><div class="modal-actions">${button('继续优化','close-modal')}${button(mode==='endless'?'下一轮急诊':LEVELS.indexOf(current)===LEVELS.length-1?'完成轮转':'下一病例','next','','primary')}</div>`;}
else if(modal==='wipe')html=`<div class="eyebrow">LOCAL ARCHIVE RESET</div><h2>清空全部进度</h2><p>将清除本机战役、研发和个人最佳。建议先在设置导出存档。</p><div class="modal-actions">${button('保留进度','close-modal')}${button('确定清空','wipe-confirm','','danger')}</div>`;
return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${modal}">${html}</section></div>`;}
function render(){document.body.classList.toggle('no-motion',!save.settings.motion);document.body.classList.toggle('high-contrast',!!save.settings.contrast);app.innerHTML=`<div class="shell">${nav()}${screen==='home'?home():screen==='chapter'?chapterScreen():screen==='game'?game():screen==='workshop'?workshop():screen==='records'?records():screen==='settings'?settings():help()}</div>${modalHTML()}`;}
function submit(){if(modal||remaining<=0&&isTimed())return;const r=result();if(!r.passed){modal='failed';sound('fail');render();return;}if(mode==='campaign'){const before=save.credits;save=awardCase(save,current,state,{...r,assisted},elapsed);toast(`复检通过 · 获得 ${save.credits-before} 研发点`);}else if(!roundAwarded){roundAwarded=true;runScore+=100+Math.max(0,Math.floor(remaining/5))+Math.max(0,current.limits.edits-r.edits)*15;save.endless??={bestRound:0,bestScore:0,lastSeed:''};save.endless.bestRound=Math.max(save.endless.bestRound,round);save.endless.bestScore=Math.max(save.endless.bestScore,runScore);save.endless.lastSeed=seed;}syncDraft();modal='success';sound('success');render();}
function nextCase(){if(mode==='endless'){startEndless(seed,round+1);return;}const ix=LEVELS.indexOf(current);if(ix+1<LEVELS.length)startLevel(LEVELS[ix+1]);else{screen='home';modal=null;save.draft=null;persist();render();toast('六科轮转完成。大师病例与无尽夜班等待更精良的处方。');}}
function action(a,el){switch(a){case'nav':syncDraft();screen=el.dataset.screen;modal=null;render();break;case'continue':mode='campaign';startLevel(LEVELS[unlock()]);break;case'resume':resumeDraft();break;case'chapter':syncDraft();chapter=Number(el.dataset.chapter);screen='chapter';modal=null;render();break;case'case':mode='campaign';startLevel(LEVELS.find(l=>l.id===el.dataset.level));break;case'endless':seed=document.querySelector('#seed-input')?.value??seed;runScore=0;startEndless(seed,1);break;case'select-node':selection={type:'node',id:el.dataset.id};render();break;case'select-edge':selection={type:'edge',id:el.dataset.id};render();break;case'part':changePart(el.dataset.part);break;case'undo':if(undo.length&&!modal){redo.push(cloneState(state));state=undo.pop();syncDraft();render();}break;case'redo':if(redo.length&&!modal){undo.push(cloneState(state));state=redo.pop();syncDraft();render();}break;case'reset':update(newState(current));break;case'path':pathSelection=el.dataset.id;render();break;case'all-paths':allPaths=!allPaths;render();break;case'worst':{const p=[...result().paths].sort((a,b)=>Math.min(a.setup,a.hold)-Math.min(b.setup,b.hold))[0];pathSelection=p?.id;render();break;}case'pause':modal='paused';syncDraft();render();break;case'close-modal':if(modal==='tutorial'){save.tutorialSeen=true;persist();}modal=null;lastTick=Date.now();render();break;case'hint':hintCount=Math.min(3,hintCount+1);modal='hints';syncDraft();render();break;case'demonstrate':{modal=null;assisted=true;const gg=Object.keys(current.reference.gates).find(id=>state.gates[id]!==current.reference.gates[id]),ee=Object.keys(current.reference.edges).find(id=>state.edges[id]!==current.reference.edges[id]);if(gg||ee){selection={type:gg?'node':'edge',id:gg||ee};const n=cloneState(state);(gg?n.gates:n.edges)[gg||ee]=(gg?current.reference.gates:current.reference.edges)[gg||ee];update(n);toast('主治已演示一次替换，请观察前后裕量再自行复检');}else{render();toast('参考处方已就绪，请复检');}break;}case'submit':submit();break;case'next':nextCase();break;case'retry':startLevel(current,{mode,seed,round,runScore,roundAwarded,assisted,hints:hintCount});break;case'buy':{const old=save;const b=buyUpgrade(save,el.dataset.id);save=b.save??b;if(save.credits<old.credits)toast('器材研发完成');else toast('研发点不足或器材已经装配');persist();render();break;}case'record':{const l=LEVELS.find(l=>l.id===el.dataset.level),b=save.completed[l.id]?.best?.[el.dataset.kind];if(b){if(!evaluate(l,b.state,availableEquipment(save,l)).valid){toast('旧档案结构失效，请重新诊断');break;}startLevel(l,{state:b.state,mode:'campaign',assisted:b.assisted});toast('已载入完整个人最佳，请重新复检');}break;}case'setting':save.settings[el.dataset.id]=!save.settings[el.dataset.id];persist();render();break;case'notebook-save':save.notebook??={};save.notebook[current.id]={state:cloneState(state)};persist();toast('试验处方已保存，可跨重试载入');render();break;case'notebook-load':if(save.notebook?.[current.id])update(cloneState(save.notebook[current.id].state));break;case'export':{const blob=new Blob([JSON.stringify(save,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='TimingER-save.json';link.click();URL.revokeObjectURL(url);toast('存档已导出');break;}case'import':document.querySelector('#import-file').click();break;case'wipe':modal='wipe';render();break;case'wipe-confirm':save=defaultSave();persist();persist();screen='home';current=null;modal=null;render();toast('轮转进度已重置');break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el);});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'&&e.target.files[0]){try{const raw=await e.target.files[0].text();const {recoverSave}=__modules.progress;const restored=recoverSave(raw);if(!restored||![1,2].includes(JSON.parse(raw).version))throw new Error();save=restored.save??restored;persist();screen='home';current=null;modal=null;render();toast('存档已恢复');}catch{toast('存档无法读取，当前进度保持不变');}}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='Enter'&&e.target.dataset.action){e.preventDefault();action(e.target.dataset.action,e.target);return;}if(screen!=='game')return;if(e.code==='Space'){e.preventDefault();modal=modal==='paused'?null:'paused';lastTick=Date.now();syncDraft();render();return;}if(modal)return;if(e.ctrlKey&&(e.key.toLowerCase()==='z'||e.key.toLowerCase()==='y')){e.preventDefault();action(e.key.toLowerCase()==='y'||e.shiftKey?'redo':'undo',document.body);return;}if(/^[1-9]$/.test(e.key)){const buttons=[...document.querySelectorAll('.tool')];buttons[Number(e.key)-1]?.click();}if(e.key==='Enter'&&e.target===document.body)submit();if(e.key.startsWith('Arrow')){const nodes=current.nodes.filter(n=>n.kind==='gate'&&!n.locked);const ix=nodes.findIndex(n=>n.id===selection?.id);selection={type:'node',id:nodes[(ix+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+nodes.length)%nodes.length]?.id};e.preventDefault();render();}});
window.addEventListener('blur',()=>{if(screen==='game'&&!modal&&isTimed()){modal='paused';syncDraft();render();}});
window.addEventListener('beforeunload',syncDraft);
setInterval(()=>{const now=Date.now(),delta=(now-lastTick)/1000;lastTick=now;if(screen!=='game'||modal||!isTimed())return;remaining=Math.max(0,remaining-delta);elapsed+=delta;const display=document.querySelector('#timer-display');if(display){display.firstChild.textContent=timeString(remaining);display.classList.toggle('bad',remaining<30);}if(remaining<=0){modal='timeout';sound('fail');syncDraft();render();}else if(Math.floor(remaining)%5===0)syncDraft();},250);
render();

return {};
})();
</script></body></html>
