er:"第二章 · 学会接力",story:"两座远处的重钟把整条长街拖慢了。工坊送来一枚缓冲器：它会接下后面的重担，先等一小会儿，再重新运行脉冲。放在哪里，才值得这笔材料？",size:{width:13,height:9},source:on([1,4]),sinks:[j("A",[11,1],3),j("B",[11,7],3)],obstacles:[],limits:Rn(.18,8.6,24,1,30),allowedTools:Ve,referenceSolution:Tt,teachingExample:{edges:[...Tt.edges],buffers:[]},hints:["只用铜线也能同时到达，但两座重钟会一起迟到。","把缓冲器放在共同主干上，两条支路都能得到接力。","试试把缓冲器放在上下分叉附近，而不是只给其中一座钟加速。"]},{id:"06",title:"小巷不用驿站",subtitle:"短线的陷阱 · 接力也需要等待",chapter:"第二章 · 学会接力",story:"学徒想在每条小巷都安驿站，结果街灯反而错开了。短线和轻灯不一定需要接力；一枚元件自己的等待，也足以破坏原本整齐的节奏。",size:{width:11,height:9},source:on([1,4]),sinks:[j("A",[4,3]),j("B",[4,5])],obstacles:[],limits:Rn(.1,3.4,11,1,17),allowedTools:Ve,referenceSolution:At,teachingExample:{edges:[...At.edges],buffers:[d(on([3,3]))]},hints:["这次线路很短，先试着不用缓冲器。","只在一条短支路加元件，可能让那一盏灯更晚亮。","画出短而对称的两条支路；若一侧放了缓冲器，移除它再看时间轴。"]},{id:"07",title:"修复：搬一座驿站",subtitle:"铜线不能动 · 只移动一个缓冲器",chapter:"第二章 · 学会接力",story:"线路已经封进石板，学徒却把唯一的驿站装在北侧。你只能拆下这一个元件，再安到新位置。尝试和撤销不算次数，最后的布置才算。",size:{width:11,height:9},source:on([1,4]),sinks:[j("A",[9,1],3),j("B",[9,7],3)],obstacles:[],limits:Rn(.16,7.4,18,1,24),allowedTools:["buffer","inspect"],referenceSolution:Lt,initialCircuit:{edges:[...Lt.edges],buffers:[d(on([5,1]))]},repairRules:{maxEdgeDifference:0,maxAddedBuffers:1,maxRemovedBuffers:1,preserveBufferCount:!0},hints:["两条支路对称，只有缓冲器的位置偏向一边。","移到 A、B 都必须经过的地方，接力效果就能一起发生。","拆下北侧元件，放到中线分叉点；线路一格也不必改。"]},{id:"08",title:"城墙之间",subtitle:"两道城墙 · 四扇窄门",chapter:"第三章 · 午夜工坊",story:"老城区禁止凿墙，铜线只能穿过留下的小门。先看清两条完整的通道，再决定在何处分开。上下绕行都不轻松，但它们可以走出同样的节奏。",size:{width:13,height:9},source:on([1,4]),sinks:[j("A",[11,1]),j("B",[11,7])],obstacles:[...[0,1,3,4,5,7,8].map(n=>on([4,n])),...[0,2,3,4,5,6,8].map(n=>on([8,n]))],limits:Rn(.12,8.3,28),allowedTools:oe,referenceSolution:hi,hints:["第一道墙的门在较靠中间处，第二道墙的门更靠上下两端。","先在第一道墙左侧分叉，各走一条完整通道。","上路穿第一道墙后向上拐一格；下路做镜像，最后分别横向接上两盏灯。"]},{id:"09",title:"修复：最后一个转角",subtitle:"最终线路差异 ≤ 4 格 · 不是点击次数",chapter:"第三章 · 午夜工坊",story:"巡夜人只允许你掀开一小块路面。南灯快了一点，不能全城返工。拆一格、补三格，正好可以给它安排一个小转角。",size:{width:11,height:9},source:on([1,4]),sinks:[j("A",[9,2]),j("B",[7,6])],obstacles:[],limits:Rn(.12,6.8,18),allowedTools:oe,referenceSolution:mi,initialCircuit:bi,repairRules:{maxEdgeDifference:4,maxAddedBuffers:0,maxRemovedBuffers:0},hints:["线路已经接通，B 比 A 提前；要改的是最后的小支路。","用三格绕路替换一格直线，路径会多两格，但最终差异是四格。","B 左边那一格可以向下绕：拆掉直连，画出一个小 U 再接回 B。"]},{id:"10",title:"最后一卷铜线",subtitle:"材料限额 27 · 三座钟楼共享主街",chapter:"第三章 · 午夜工坊",story:"铜线铺只剩最后一卷，明天的庆典却要三处同时开场。你得把每一格线都用到实处：先共用，再分开，给较近的剧场留一个小弯。",size:{width:13,height:9},source:on([1,4]),sinks:[j("A",[11,1]),j("B",[10,4]),j("C",[11,7])],obstacles:[],limits:Rn(.16,12,27,0,27),allowedTools:oe,referenceSolution:gi,hints:["三条各自独立的长路会超出材料限额。","公共主干可以长一点；上下两条分支保持对称。","中间的 B 也需要等一等，用主干右侧的上方空地给它绕一个小弯。"]},{id:"11",title:"分毫不差",subtitle:"同步误差 ≤ 0.08 · 绕路与接力一起用",chapter:"序章结业 · 十二时之约",story:"钟匠公会想听一声几乎完美的合奏。北边轻、南边重，旧办法必须配合起来：让轻钟慢慢走，让重钟得到及时的接力，然后一点点收紧误差。",size:{width:13,height:9},source:on([1,4]),sinks:[j("A",[11,1]),j("B",[11,7],3)],obstacles:[],limits:Rn(.08,10.5,30,1,36),allowedTools:Ve,referenceSolution:wi,hints:["B 重三倍，用相同的路线长度不能达到这次的精度。","把唯一的缓冲器安排在 B 的支路上，同时给 A 一条更长的路。","A 可先从中线向上，再往左绕到最上沿；B 的缓冲器试放在下侧转角，比较两盏灯的微小时间差。"]},{id:"12",title:"午夜，整座城",subtitle:"工匠试炼 · 三声钟鸣，一个午夜",chapter:"序章结业 · 十二时之约",story:"午夜将到，城门、广场、渡口都等着你的最后一声。墙不能穿，重钟不能拖累整座城，材料也不无限。你已经知道所有工具的脾气；现在，给旧钟城一个自己的答案。",size:{width:13,height:9},source:on([1,4]),sinks:[j("A",[11,1]),j("B",[10,4],3),j("C",[11,7])],obstacles:[...[0,1,2,6,7,8].map(n=>on([4,n])),...[1,3,4,5,6,7].map(n=>on([8,n]))],limits:Rn(.12,12.8,42,2,50),allowedTools:Ve,referenceSolution:vi,hints:["先找城墙的三处出口：最上沿、上方小门、最下沿。","A、C 可以镜像走外侧，B 更重，需要自己的接力；主干依然值得共享。","让 B 从上方小门穿墙，在重钟前几格放缓冲器；上下轻钟走长一些的边缘路线，再微调误差。"]}],Bt=[{title:"背面点火",sinkCount:4,technology:"bspdn",powered:!0,bufferDepth:1,axis:"x",story:"新工坊把供电搬到了线路背后。缓冲器只能站在供电焊盘上，功率也按枚计费。四盏灯只是开始，先学会把一次接力用在一整个分区。"},{title:"八坊分流",sinkCount:8,technology:"bspdn",powered:!0,bufferDepth:1,story:"八个街坊接入背面电源，铜线预算却没有跟着翻倍。把街坊分成小组，再把小组合成两条主街；逐级分叉比八条独立长线更可靠。"},{title:"轻重成双",sinkCount:8,technology:"bspdn",powered:!0,heavy:!0,bufferDepth:1,story:"每一对街灯都搭配了一座重钟。复制一条等长线路已经行不通了：在最末端安排轻钟等待，再把这一小对的节奏复制给其他分区。"},{title:"十六个心跳",sinkCount:16,technology:"bspdn",powered:!0,bufferDepth:1,axis:"y",story:"城市扩成十六块小街区。最外侧的终点不再适合逐个照顾，先沿供电点建立分区主干，再把每组终点接成整齐的小树。"},{title:"供电孤岛",sinkCount:16,technology:"bspdn",powered:!0,heavy:!0,bufferDepth:1,obstacleDensity:.11,story:"背面焊盘被旧墙分隔，重钟又藏在每组的另一端。路线要绕过岛屿，缓冲器要踩准供电点；整组调整时，别忘记末端轻重的差别。"},{title:"修复：失位的电源",sinkCount:16,technology:"bspdn",powered:!0,heavy:!0,bufferDepth:2,repair:"buffer",story:"图纸已经封板，其中一枚缓冲器落在了邻近焊盘上。铜线全部保留，只准移动一枚元件。观察是哪组先失去节奏，再修正那一级接力。"},{title:"修复：岛边绕行",sinkCount:16,technology:"bspdn",powered:!0,bufferDepth:2,repair:"wire",story:"维修队在岛边多绕了一个转角，整个分区跟着慢了下来。供电与元件不能动，只允许最后四条单位边不同；这次要看局部修改如何影响整组灯。"},{title:"功率封顶",sinkCount:32,technology:"bspdn",powered:!0,bufferDepth:2,story:"三十二个接收器共享一张背面电源网。功率已经封顶，堆元件解决不了问题。把接力放在能隔离整个子树的位置，让每枚缓冲器都有足够价值。"},{title:"重钟阵列",sinkCount:32,technology:"bspdn",powered:!0,fullBackplane:!0,heavy:!0,bufferDepth:2,story:"背面电源终于覆盖全图，缓冲器不用再寻找焊盘，但总功率仍然严格。重钟也变成了一整片阵列；先平衡轻重小对，再决定自由的接力位置。"},{title:"三阶接力",sinkCount:32,technology:"bspdn",powered:!0,bufferDepth:3,obstacleDensity:.12,story:"三层分叉、三次接力，但功率和材料仍然有限。先找哪一级驱动负载最沉，再决定供电焊盘值得怎样使用；越靠近源的改动，影响越广。"},{title:"修复：半城失拍",sinkCount:32,technology:"bspdn",powered:!0,heavy:!0,bufferDepth:2,repair:"buffer",story:"半座城的时间偏了，一枚焊盘上的元件是唯一可动的部件。别被三十二个读数淹没：找出早晚两组共享的祖先，就能缩小维修范围。"},{title:"背面电源之城",sinkCount:64,technology:"bspdn",powered:!0,fullBackplane:!0,heavy:!0,bufferDepth:2,obstacleDensity:.13,story:"六十四个接收器同时等待全域背面电源网。缓冲器位置自由，功率和铜线却没有多一份；利用自由重新安排主干、分区与末端的职责。"},{title:"第一座跨层桥",sinkCount:4,technology:"3dic",layers:2,bufferDepth:0,story:"时钟源搬进底座，四个接收器在另一块晶片上。沟壑不能用铜线横穿，只有标出的跨层口能够通行；选桥也要比较等待和材料。"},{title:"晶片上的街区",sinkCount:8,technology:"3dic",layers:2,bufferDepth:1,story:"新晶片装进八个街区，跨层口把它们一起接向底座。过桥后重新驱动分区，比让源承担整块晶片的负载更有余地。"},{title:"双晶片合奏",sinkCount:8,technology:"3dic",layers:3,bufferDepth:1,story:"两块接收晶片共享一个驱动底座。先选择同样节奏的桥，再让两层各自分叉；每块晶片内的平衡，也会影响源的共同等待。"},{title:"上下轻重",sinkCount:16,technology:"3dic",layers:3,heavy:!0,bufferDepth:1,story:"两层都出现了轻灯与重钟。跨层桥不会替你抵消末端差别，先处理小对的轻重，再把两块晶片的入口节奏对齐。"},{title:"背面供电，正面跨层",sinkCount:16,technology:"3dic",layers:2,powered:!0,bufferDepth:1,story:"跨层结构接上了背面供电：桥的位置、焊盘的位置都固定了。你能自由安排的是中间的线路树，材料和功率要同时过关。"},{title:"修复：选错的桥",sinkCount:16,technology:"3dic",layers:3,bufferDepth:1,repair:"via",story:"封好的线路里，一层晶片接到了更慢的跨层口。只准最后两条边不同：拆掉错误的桥，换一座合适的桥，元件与层内铜线全部保留。"},{title:"三十二路穿行",sinkCount:32,technology:"3dic",layers:2,heavy:!0,bufferDepth:2,story:"一座跨层桥要承载三十二个目的地。别在桥后立刻铺成扇形长线；先分区、再隔离负载，让每一级公共线路保持可解释的职责。"},{title:"三层时刻表",sinkCount:32,technology:"3dic",layers:3,bufferDepth:2,story:"底座与两块晶片组成完整的三层时刻表。桥的等待固定，线路的等待可以安排；在入口和分区之间找到合适的接力位置。"},{title:"跨层功率账本",sinkCount:32,technology:"3dic",layers:3,powered:!0,fullBackplane:!0,heavy:!0,bufferDepth:2,story:"三层晶片都有全域背面供电，元件位置自由，功率账本却容不下多余一枚。跨层桥还有材料收费，先安排入口接力，再补偿末端轻重。"},{title:"修复：桥后的转角",sinkCount:32,technology:"3dic",layers:2,bufferDepth:2,repair:"wire",story:"桥没有坏，桥后的线路却多绕了两格。你只能调整四条单位边，不能更换元件；从异常分区向上追踪，找到那一个多余转角。"},{title:"修复：三层失约",sinkCount:32,technology:"3dic",layers:3,heavy:!0,bufferDepth:2,repair:"via",story:"三层都有信号，却没有共同的约定时刻。一座错误的桥让晶片从侧面接入，破坏了分区接力；只换桥，不返工整座城。"},{title:"堆叠钟城",sinkCount:64,technology:"3dic",layers:3,powered:!0,fullBackplane:!0,heavy:!0,bufferDepth:2,obstacleDensity:.12,story:"六十四座终点分布在两块接收晶片上，全域背面供电释放了元件位置。总功率、桥数、材料和最晚到达仍要一起验收，把空间安排成时间。"},{title:"从街区到阵列",sinkCount:16,technology:"megascale",heavy:!0,bufferDepth:1,story:"进入大电路工坊后，每个小谜题都变成阵列中的一格。先把一个轻重小组做好，再让更大一级的树为所有小组提供同样节拍。"},{title:"三十二条回声",sinkCount:32,technology:"megascale",bufferDepth:2,axis:"y",story:"三十二条回声从远处返回，材料只允许少量余量。反复分叉的结构能节约主干；每改一条公共线，都先看看它照顾了多少终点。"},{title:"负载的森林",sinkCount:32,technology:"megascale",heavy:!0,bufferDepth:2,obstacleDensity:.11,story:"障碍在树之间长成森林，终点也有轻重之分。保持主干层级清楚，逐组解决末端延迟，避免为了局部绕行重新连接成环。"},{title:"修复：阵列的根",sinkCount:32,technology:"megascale",powered:!0,heavy:!0,bufferDepth:2,repair:"buffer",story:"阵列的一根主枝偏了时间，线路不能动，电源焊盘也不能搬。找出错位缓冲器属于哪一级分叉，只移动它一次完成全组修复。"},{title:"六十四灯",sinkCount:64,technolog
